{%extends "base.html"%}
{%block content%}
<h2>
    {{"Editar integrante" if integrante else "Nuevo Integrante"}}
</h2>

<!-- Apunta a la ruta de editar si existe el integrante. A la de agregar si es nuevo -->

<form action="{{url_for('gasto_bp.editar_integrante', id=integrante.id) if integrante else url_for('gasto_bp.agregar_integrante')}}" method="POST" class="form-card">
    <div class="form-group">
        <label for="nombre">Nombre del integrante:</label>
        <input type="text" id="nombre" name="nombre" value="{{integrante.nombre if integrante else ''}}" required class="input-select">
    </div>
            
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{url_for('gasto_bp.gestionar_integrantes')}}" class="btn btn-cancel">Cancelar</a>
    </div>
</form>
{%endblock%}
